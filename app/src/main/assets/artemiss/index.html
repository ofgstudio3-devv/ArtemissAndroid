<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12151C">
<title>ARTEMISS AI Pro</title>

<style>

  html, body { background: #000000; margin:0; }

@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

iframe[src*="appgeyser"], iframe[src*="appmint"], iframe[src*="doubleclick"], iframe[src*="googlesyndication"],
iframe[src*="googleadservices"], iframe[src*="admob"], iframe[src*="adservice"],
iframe[src*="popads"], iframe[src*="propellerads"], iframe[src*="adcolony"],
iframe[src*="unityads"], iframe[src*="startapp"], iframe[src*="applovin"],
iframe[src*="mopub"], iframe[src*="vungle"], iframe[src*="taboola"], iframe[src*="outbrain"],
.adsbygoogle, [id*="ad-banner"], [class*="ad-banner"], [id*="appgeyser-ad"], [class*="appgeyser-ad"], [id*="appmint-ad"], [class*="appmint-ad"],
div[id^="google_ads"], div[class^="google_ads"], ins.adsbygoogle{
  display:none !important; height:0 !important; width:0 !important; opacity:0 !important;
}

:root{
  --bg:#0A0A0D; --bg2:#161619;
  --glass:rgba(148,163,184,.05); --glass-strong:rgba(148,163,184,.09); --border:rgba(148,163,184,.14);
  --text:#EDEFF4; --text2:#8A93A6;
  --purple:#A855F7; --blue:#0A84FF; --green:#30D158; --red:#FF453A;
  --gradient:linear-gradient(135deg, #A855F7, #38BDF8);
  --user-bubble: rgba(255,255,255,.08);
  --user-bubble-border: rgba(255,255,255,.10);
  --radius:20px;
  --anim: cubic-bezier(.22,1,.36,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --app-height: 100dvh;
  --kb-offset: 0px;
  --serif: 'Roboto', -apple-system, sans-serif;
}
/* Modo Ultra: el celeste se corre "medio medio" hacia púrpura, el resto del tema se mantiene igual */
body.ultra-mode{ --blue: #6D6AF0; }
*{margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; outline:none;}
html, body{ height:100%; width:100%; position:fixed; inset:0; overflow:hidden; overscroll-behavior:none; }
body{
  font-family: var(--serif), -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
  background: var(--bg); color:var(--text); font-weight:700;
}
body::before{
  content:""; position:fixed; inset:0;
  background:
    radial-gradient(circle at 30% 40%, rgba(168,85,247,.045), transparent 50%),
    radial-gradient(circle at 70% 60%, rgba(56,189,248,.03), transparent 50%);
  filter:blur(140px); animation:floatBg 20s ease-in-out infinite alternate; z-index:-2;
}
@keyframes floatBg{0%{transform:translateY(-30px)}100%{transform:translateY(30px)}}
.glass{ background:var(--glass); backdrop-filter:blur(20px) saturate(150%); border:1px solid var(--border); border-radius:var(--radius); }
.tap{ transition: transform .22s cubic-bezier(.17,.89,.32,1.28), opacity .15s var(--anim); }
.tap:active{ transform:scale(.93); opacity:.75; transition: transform .08s ease-out, opacity .08s ease-out; }
#app{ display:flex; flex-direction:column; height:var(--app-height); animation: appIn .5s var(--anim) both; }
@keyframes appIn{from{opacity:0} to{opacity:1}}

/* ===== HEADER PLANO ESTILO CHATGPT (sin barra flotante) ===== */
.topbar-flat{ flex-shrink:0; padding:max(45px, calc(env(safe-area-inset-top) + 18px)) 14px 10px; display:flex; align-items:center; justify-content:space-between; background:var(--bg); position:relative; z-index:20; box-shadow:0 6px 18px rgba(0,0,0,.35); outline:none; }
.topbar-flat *{ outline:none; -webkit-tap-highlight-color:transparent; }
.topbar-flat h2{ display:none; }
.mode-tabs{ display:flex; gap:18px; position:relative; }
.mode-tab{ background:transparent; border:none; color:var(--text2); font-size:15.5px; font-weight:700; cursor:pointer; padding:4px 2px 8px; transition: color .25s var(--anim); }
.mode-tab.active{ color:var(--text); }
.mode-tab-indicator{ position:absolute; bottom:0; height:3px; border-radius:3px; background:var(--blue); transition: left .3s cubic-bezier(.34,1.4,.5,1), width .3s cubic-bezier(.34,1.4,.5,1); }
.icon-btn{ width:40px; height:40px; border-radius:12px; background:transparent; border:none; color:var(--text); font-size:21px; cursor:pointer; display:grid; place-items:center; transition: transform .2s var(--spring), background .2s var(--anim);}
.icon-btn:active{ transform:scale(.85); background:var(--glass-strong); }
.icon-btn img{ width:25px; height:25px; object-fit:contain; }

/* ===== SIDEBAR ===== */
.sidebar-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0); z-index:900; display:none; transition: background .3s var(--anim); }
.sidebar-overlay.show{ display:block; background:rgba(0,0,0,.55); }
.sidebar{
  position:fixed; top:0; left:0; height:100%; width:82%; max-width:300px; z-index:950;
  background:var(--bg2); border-right:1px solid var(--border);
  transform:translateX(-100%); transition: transform .42s cubic-bezier(.32,.9,.35,1.15);
  display:flex; flex-direction:column; padding:max(38px, calc(env(safe-area-inset-top) + 18px)) 14px 14px;
}
.sidebar.open{ transform:translateX(0); }
.sidebar-wordmark{ font-family:var(--serif); font-size:30px; font-weight:700; color:var(--text); margin-bottom:22px; }
.sidebar-menu-row{ display:flex; align-items:center; gap:12px; padding:11px 6px; font-size:16.8px; font-weight:700; color:var(--text2); }
.sidebar-menu-row .row-icon{ font-size:19px; width:20px; text-align:center; }
.sidebar-divider{ height:1px; background:var(--border); margin:10px 0 14px; }
.sidebar-recientes{ font-size:13.8px; font-weight:700; color:var(--text2); text-transform:none; padding:0 6px 8px; }
.sidebar-history{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
.history-item-side{ display:flex; align-items:center; gap:8px; padding:10px 6px; border-radius:10px; transition: background .2s var(--anim);}
.history-item-side .history-title{ flex:1; min-width:0; font-size:15.8px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.history-item-side.active .history-title{ color:var(--purple); }
.history-item-side:active{ background:var(--glass-strong); }
.history-delete{ flex-shrink:0; width:26px; height:26px; border-radius:8px; display:grid; place-items:center; color:var(--text2); font-size:14.8px; cursor:pointer; background:transparent; border:none; }
.history-delete:active{ background:var(--glass-strong); transform:scale(.9); }
.sidebar-footer{ border-top:1px solid var(--border); padding-top:12px; margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.sidebar-profile{ display:flex; align-items:center; gap:9px; cursor:pointer; padding:6px; border-radius:12px; min-width:0; }
.profile-avatar{ width:38px; height:38px; border-radius:50%; background:var(--glass-strong); border:1px solid var(--border); display:grid; place-items:center; color:var(--text); font-weight:800; font-size:15.8px; flex-shrink:0; overflow:hidden;}
.profile-avatar img{ width:100%; height:100%; object-fit:cover; }
.sidebar-newchat-pill{ display:flex; align-items:center; gap:6px; padding:11px 16px; border-radius:20px; background:var(--text); color:var(--bg); font-weight:700; font-size:15.3px; cursor:pointer; white-space:nowrap; flex-shrink:0;}
.sidebar-newchat-pill:active{ transform:scale(.95); }

.pages{flex:1; margin:0 6px; display:flex; flex-direction:column; min-height:0; position:relative;}
.page{ display:none; flex-direction:column; flex:1; min-height:0; position:absolute; inset:0; opacity:0; transform:translateX(24px) scale(.98);}
.page.active{ display:flex; position:relative; opacity:1; transform:translateX(0) scale(1); animation: pageIn .45s var(--spring) both;}
.page.leaving{ animation: pageOut .3s var(--anim) both; }
@keyframes pageIn{ from{opacity:0; transform:translateX(24px) scale(.98);} to{opacity:1; transform:translateX(0) scale(1);} }
@keyframes pageOut{ from{opacity:1; transform:translateX(0) scale(1);} to{opacity:0; transform:translateX(-24px) scale(.98);} }

/* ===== CHAT — burbujas más sobrias ===== */
.chat-messages{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 4px 8px; display:flex; flex-direction:column; overscroll-behavior:contain; position:relative; z-index:1;}
.bg-watermark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:0; }
.bg-watermark img{ width:52%; max-width:260px; opacity:.05; filter:grayscale(1); }
.fade-top, .fade-bottom{ position:absolute; left:0; right:0; height:26px; pointer-events:none; z-index:5; }
.fade-top{ top:0; background:linear-gradient(to bottom, var(--bg), transparent); }
.fade-bottom{ bottom:0; background:linear-gradient(to top, var(--bg), transparent); }
.msg-row{ width:100%; padding:9px 4px; animation: messageIn .35s var(--anim) both;}
.msg-inner{ display:flex; gap:9px; align-items:flex-start; max-width:100%;}
.msg-row.user .msg-inner{ flex-direction:row-reverse; }
.msg-content{ flex:1; min-width:0; padding-top:3px;}
.msg-row.user .msg-content{ display:flex; flex-direction:column; align-items:flex-end;}
.msg-text{ font-size:17.3px; line-height:1.65; font-weight:500; color:var(--text);}
.msg-text b{ font-weight:800; }
.msg-text code{ background:rgba(128,128,128,.15); padding:2px 6px; border-radius:6px; font-family:'SF Mono',Menlo,monospace; font-size:14.8px;}
.msg-text a{ color:var(--blue); text-decoration:underline; }
.msg-text ul{ margin:6px 0 6px 18px; }
.msg-text.user-bubble{ background:var(--user-bubble); border:1px solid var(--user-bubble-border); color:var(--text); padding:10px 15px; border-radius:16px; display:inline-block; max-width:90%; font-weight:700; }
.avatar-fx{ width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--glass-strong); border:1px solid var(--border); font-weight:700; font-size:12.5px; color:var(--text2); flex-shrink:0; overflow:hidden; }
.avatar-fx.ai-img{ background:transparent; border:none; }
.avatar-fx img{ width:100%; height:100%; object-fit:cover; border-radius:inherit; display:block; }
.msg-actions{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.msg-actions button{ background:var(--glass-strong); border:1px solid var(--border); color:var(--text2); font-size:12.5px; font-weight:600; padding:5px 10px; border-radius:9px; cursor:pointer; display:flex; align-items:center; gap:4px; transition: transform .15s var(--spring);}
.msg-actions button:active{ transform:scale(.9); }
@keyframes messageIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.cursor-blink{ display:inline-block; width:2px; height:14px; background:var(--text2); margin-left:2px; vertical-align:middle; animation: blink 1s step-start infinite; }
@keyframes blink{ 50%{ opacity:0; } }

.typing-dots{ display:flex; gap:4px; padding:6px 0; align-items:center; }
.typing-dots span{ width:6px; height:6px; border-radius:50%; background:var(--text2); animation: dotBounce 1.2s infinite ease-in-out; }
.typing-dots span:nth-child(2){ animation-delay:.15s; }
.typing-dots span:nth-child(3){ animation-delay:.3s; }
@keyframes dotBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.4; } 30%{ transform:translateY(-5px); opacity:1; } }
.typing-status{
  font-size:13.8px; font-weight:600; margin-left:8px;
  background:linear-gradient(90deg, var(--text2) 0%, var(--text) 50%, var(--text2) 100%);
  background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation: statusShimmer 1.8s linear infinite;
}
@keyframes statusShimmer{ to{ background-position:-200% center; } }

.image-gen-placeholder{
  width:100%; max-width:260px; aspect-ratio:1/1; border-radius:16px;
  background: linear-gradient(110deg, rgba(128,128,128,.07) 8%, rgba(128,128,128,.15) 18%, rgba(128,128,128,.07) 33%);
  background-size: 200% 100%; animation: shimmer 1.6s linear infinite;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  color:var(--text2); font-size:14.3px; font-weight:600; border:1px solid var(--border);
}
@keyframes shimmer{ to{ background-position-x:-200%; } }
.gen-icon{ font-size:26px; animation: genPulse 1.4s ease-in-out infinite; }
@keyframes genPulse{ 0%,100%{ transform:scale(1); opacity:.7; } 50%{ transform:scale(1.12); opacity:1; } }
.gen-image{ width:100%; max-width:260px; border-radius:16px; display:block; opacity:0; transform:scale(.95); transition: opacity .4s var(--anim), transform .4s var(--anim); margin-top:6px; cursor:pointer; }
.gen-image.loaded{ opacity:1; transform:scale(1); }

.suggestion-chips, .followup-chips{ display:flex; flex-wrap:wrap; gap:7px; padding:10px 8px 4px; }
.chip{ padding:8px 13px; border-radius:12px; background:var(--glass-strong); border:1px solid var(--border); font-size:13.8px; font-weight:600; cursor:pointer; color:var(--text2); transition: transform .15s var(--spring);}
.chip:active{ transform:scale(.93); }

/* ===== PANTALLA DE SALUDO (vacía) ===== */
.greeting-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:50px 24px 10px; flex:1; }
.greeting-icon{ width:64px; height:64px; margin-bottom:18px; animation: greetingPop .6s var(--spring) both; }
.greeting-icon img{ width:100%; height:100%; object-fit:cover; }
@keyframes greetingPop{ from{ opacity:0; transform:scale(.5) rotate(-15deg);} to{ opacity:1; transform:scale(1) rotate(0);} }
.greeting-text{ font-size:28px; font-weight:700; font-family:var(--serif); letter-spacing:-.3px; margin-bottom:8px; animation: messageIn .5s var(--anim) both .1s; }
.greeting-sub{ color:var(--text2); font-size:15.8px; font-weight:700; animation: messageIn .5s var(--anim) both .2s; }

/* ===== COMPOSER estilo app de chat con IA (2 filas) ===== */
.composer{
  flex-shrink:0; margin:3px 10px calc(28px + env(safe-area-inset-bottom) + var(--kb-offset)); padding:14px 16px 10px;
  border-radius:32px; transition: box-shadow .25s var(--anim), margin .25s var(--anim); position:relative;
  background:var(--bg2); border:none;
  box-shadow:0 14px 34px rgba(0,0,0,.45), 0 0 0 1px rgba(148,163,184,.12), inset 0 1px 0 rgba(255,255,255,.04);
}
.composer textarea{
  width:100%; background:transparent; border:none; color:var(--text); font-size:17.3px; outline:none;
  resize:none; max-height:110px; line-height:1.4; padding:0 0 10px; font-family:inherit;
  -webkit-user-select:text; user-select:text;
}
.composer textarea::placeholder{ font-weight:700; color:var(--text2); opacity:1; }
.photo-preview{ display:flex; align-items:center; gap:8px; padding:6px 4px 10px; }
.photo-preview img{ width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; }
.photo-preview-label{ flex:1; font-size:13.8px; color:var(--text2); font-weight:600; }
.photo-preview-remove{ width:24px; height:24px; border-radius:50%; background:#232A38; border:none; color:var(--text2); font-size:13.8px; cursor:pointer; flex-shrink:0; }
.mermaid-box{ background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:10px; margin-top:6px; overflow-x:auto; max-width:100%; color:var(--text2); font-size:14.8px; }
.mermaid-box svg{ max-width:100%; height:auto; }
.composer-toolbar{ display:flex; align-items:center; gap:8px; position:relative; }
.composer-spacer{ flex:1; }
.composer-icon{ width:38px; height:38px; border-radius:50%; background:#232A38; border:none; color:var(--blue); font-size:17.8px; cursor:pointer; display:grid; place-items:center; flex-shrink:0; transition: transform .2s var(--spring), background .2s var(--anim);}
.composer-icon:active{ transform:scale(.85); background:#2C3442; }
.composer-icon-round{ width:38px; height:38px; border-radius:50%; background:#232A38; border:none; color:var(--blue); font-size:16.8px; cursor:pointer; display:grid; place-items:center; flex-shrink:0; transition: transform .2s var(--spring), opacity .2s var(--anim), background .2s var(--anim);}
.composer-icon-round:active{ transform:scale(.85); background:#2C3442; }
#sendBtn{ background:var(--blue); color:#0B0B0D; border:none; }
#sendBtn:disabled{ opacity:.5; }
.send-hidden{ display:none !important; }
#micBtn.recording{ background:var(--red); color:#fff; animation: micPulse 1s ease-in-out infinite; }
@keyframes micPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,69,58,.5);} 50%{ box-shadow:0 0 0 8px rgba(255,69,58,0);} }
.btn-spinner{ width:15px; height:15px; border-radius:50%; border:2px solid rgba(0,0,0,.3); border-top-color:#0B0B0D; animation: spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* pastilla de nivel de pensamiento (ahora dentro del composer) */
.level-pill{ padding:6px 11px; border-radius:12px; background:#232A38; border:none; color:var(--text2); font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px; white-space:nowrap;}
.level-pill .chevron{ color:var(--text2); font-size:11px; opacity:.8; }
.speak-pill{
  display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:20px; border:none;
  background:var(--blue); color:#fff; font-size:13.5px; font-weight:800; cursor:pointer; white-space:nowrap; flex-shrink:0;
  box-shadow:0 4px 14px rgba(10,132,255,.35); transition: transform .2s var(--spring);
}
.speak-pill:active{ transform:scale(.93); }
.level-popover, .plus-popover{
  position:absolute; bottom:calc(100% + 8px); width:min(86vw,320px);
  background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:8px; z-index:500;
  opacity:0; pointer-events:none; transition: opacity .25s var(--anim), transform .32s cubic-bezier(.34,1.65,.55,1);
  box-shadow:0 12px 30px rgba(0,0,0,.5); transform-origin:bottom left;
}
.level-popover{ left:0; transform:translateY(10px) scale(.9); }
.plus-popover{ left:14px; transform:translateY(10px) scale(.9); }
.level-popover.show, .plus-popover.show{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
.level-option, .plus-option{ padding:10px 12px; border-radius:10px; font-size:14.8px; font-weight:600; color:var(--text2); cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
.level-option:active, .plus-option:active{ background:var(--glass-strong); }
.level-option.selected{ background:var(--glass-strong); color:var(--text); }
.level-option small{ font-weight:500; color:var(--text2); font-size:12.5px; }

.settings-page{padding:20px; overflow-y:auto; flex:1;}
.settings-page h2{ margin-bottom:20px; font-size:22px; }
.settings-header{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.back-pill{ display:flex; align-items:center; gap:6px; padding:8px 14px 8px 10px; border-radius:14px; background:var(--glass-strong); border:1px solid var(--border); cursor:pointer; font-weight:700; font-size:14.8px;}
.settings-card{padding:15px; margin-bottom:11px; display:flex; align-items:center; justify-content:space-between; font-size:16.8px;}
.settings-card label.field-label{ display:flex; flex-direction:column; gap:2px; }
.settings-card small{ color:var(--text2); font-weight:500; font-size:12.5px; }
.key-input{ margin-top:9px; width:100%; background:rgba(128,128,128,.07); border:1px solid var(--border); color:var(--text); border-radius:11px; padding:10px 13px; font-size:14.8px; outline:none; -webkit-user-select:text; user-select:text;}
.key-input:focus{ border-color:var(--blue); }
.key-status{ font-size:12.5px; margin-top:8px; font-weight:700; display:flex; align-items:center; gap:6px; }
.key-status.ok{ color:var(--green); }
.key-status.bad{ color:var(--text2); }
.switch {position: relative; display: inline-block; width: 44px; height: 25px; flex-shrink:0;}
.switch input {opacity: 0; width: 0; height: 0;}
.slider {position: absolute; cursor: pointer; inset:0; background-color: rgba(128,128,128,.25); transition:.3s var(--spring); border-radius: 34px;}
.slider:before {position: absolute; content: ""; height: 19px; width: 19px; left: 3px; bottom: 3px; background-color: white; transition:.3s var(--spring); border-radius: 50%;}
input:checked +.slider {background: var(--gradient);}
input:checked +.slider:before {transform: translateX(19px);}
.info-card{margin:12px 0; padding:14px; border-radius:16px; background:var(--glass-strong); border:1px solid var(--border); display:flex; gap:11px; align-items:center;}
.info-card span{ font-size:14.3px; line-height:1.4; color:var(--text2); }
.modal-btn{width:100%; margin-top:8px; height:42px; border-radius:12px; border:none; font-size:15.3px; font-weight:700; color:var(--text); cursor:pointer;}

.splash{position:fixed; top:0; left:0; width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:5000; overflow:hidden;}
.logo-genesis{
  width:110px; height:110px; display:flex; align-items:center; justify-content:center;
  filter: blur(22px); transform:scale(.7) rotate(-8deg); opacity:0;
  animation: logoGenesis 1.5s cubic-bezier(.22,1,.36,1) forwards, logoBreathe 2.6s ease-in-out 1.5s infinite;
  position:relative;
}
.logo-genesis::before{
  content:""; position:absolute; inset:-30px; border-radius:50%;
  background:radial-gradient(circle, rgba(168,85,247,.35), transparent 70%);
  opacity:0; animation: ringPulse 1.5s cubic-bezier(.22,1,.36,1) forwards;
}

<script>
/* =====================================================================
   RED DE SEGURIDAD (va primero que todo, a propósito)
   Si algo más abajo en el script lanza un error, esto garantiza que la
   pantalla de carga igual desaparezca en vez de quedar congelada.
   ===================================================================== */
(function splashHardFailsafe(){
  function hide(){
    const s = document.getElementById('splash');
    if(s && !s.classList.contains('hide')){

/* Acceso seguro a localStorage: en algunos WebViews (como los que genera
   AppGeyser/AppMint) leer/escribir localStorage puede lanzar un error de seguridad.
   Si eso pasa sin protección, detiene TODO el script — incluido el código
   que oculta la pantalla de carga. Por eso todo el acceso pasa por aquí. */
function storageGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null ? fallback : v; }
  catch(e){ return fallback; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, value); }catch(e){}
}

/* =====================================================================
   BLOQUEADOR DE ANUNCIOS (reforzado)
   Capas de protección:
   1) Lista negra amplia de dominios/redes de anuncios.
   2) Intercepta scripts/iframes ANTES de que lleguen a cargar (no solo
      los borra después de insertados).
   3) MutationObserver que limpia cualquier cosa que se cuele igual.
   4) Barrido periódico de respaldo cada 1.5s.
   5) Bloqueo de popups no solicitados.
   ===================================================================== */
(function adBlocker(){
  const AD_DOMAINS = [
    'appgeyser','appmint','doubleclick.net','googlesyndication','googleadservices','adservice.google',
    'admob','popads','propellerads','adcolony','unityads','unity3d.com/ads','startapp',
    'applovin','mopub','vungle','taboola','outbrain','adnxs','adsterra','exoclick','hilltopads',
    'mgid.com','criteo','smartadserver','pubmatic','rubiconproject','indexexchange','openx.net',
    'adroll','bidswitch','media.net','chartboost','ironsrc','ironsource','tapjoy','inmobi',
    'smaato','verve.com','kidoz','appodeal','fyber','adcash','revcontent','adthrive','mediavine',
    'ezoic','sovrn','teads.tv','yieldmo','sharethrough','adsafeprotected','moatads','doubleverify',
    'adform','yieldlab','smartyads','trafficjunky','popcash','adhood','clickadu','adskeeper'
  ];
  function isAdUrl(url){
    if(!url) return false;
    const u = String(url).toLowerCase();
    return AD_DOMAINS.some(d=>u.includes(d)) || /[?&]ad(id|unit|slot|_id)?=/.test(u);
  }
  function isAdElement(el){
    if(!el || el.nodeType !== 1) return false;
    const tag = el.tagName;
    if(!['IFRAME','DIV','INS','SCRIPT'].includes(tag)) return false;
    const attrs = [(el.id||''),(el.className||''),(el.getAttribute&&el.getAttribute('src')||''),(el.getAttribute&&el.getAttribute('href')||'')].join(' ').toLowerCase();
    if(isAdUrl(attrs)) return true;
    return /\bad[s]?[-_]?(banner|container|frame|slot|wrapper|unit|placement)\b/i.test(attrs);
  }
  function purge(root){
    if(!root.querySelectorAll) return;
    root.querySelectorAll('iframe, div, ins, script').forEach(el=>{ if(isAdElement(el)) el.remove(); });
  }
  purge(document.body);

  // Capa preventiva: intercepta el "src" de scripts/iframes ANTES de que carguen
  const origCreateElement = document.createElement.bind(document);
  document.createElement = function(tagName, ...rest){
    const el = origCreateElement(tagName, ...rest);
    const tag = String(tagName).toLowerCase();
    if(tag === 'script' || tag === 'iframe'){
      try{
        const proto = tag === 'script' ? HTMLScriptElement.prototype : HTMLIFrameElement.prototype;
        const desc = Object.getOwnPropertyDescriptor(proto, 'src');
        if(desc && desc.set){
          Object.defineProperty(el, 'src', {
            get(){ return desc.get.call(el); },
            set(value){ if(isAdUrl(value)){ return; } desc.set.call(el, value); },
            configurable:true
          });
        }
      }catch(e){}
      const setAttrOrig = el.setAttribute.bind(el);
      el.setAttribute = function(name, value){
        if(name === 'src' && isAdUrl(value)) return;
        return setAttrOrig(name, value);
      };
    }
    return el;
  };

  // Capa extra: cualquier elemento que se agregue directo al <body> y que
  // NO sea parte de la estructura conocida de la app se considera un
  // overlay/anuncio y se elimina de inmediato (patrón típico de anuncios
  // de pantalla completa inyectados por wrappers como AppGeyser o AppMint).
  const KNOWN_BODY_CHILDREN = ['splash','app','toast','lightbox'];
  function isKnownBodyChild(el){
    if(el.id && KNOWN_BODY_CHILDREN.includes(el.id)) return true;
    if(el.classList && el.classList.contains('sidebar-overlay')) return true;
    if(el.id === 'sidebar') return true;
    if(el.tagName === 'SCRIPT' && !el.src) return true; // nuestro propio script inline
    return false;
  }
  function guardBody(){
    Array.from(document.body.children).forEach(child=>{
      if(!isKnownBodyChild(child)) child.remove();
    });
  }
  guardBody();

  // Capa reactiva: por si algo se cuela de todos modos
  new MutationObserver(muts=>{
    for(const m of muts){
      m.addedNodes.forEach(node=>{
        if(node.nodeType!==1) return;
        if(node.parentNode === document.body && !isKnownBodyChild(node)){ node.remove(); return; }
        if(isAdElement(node)) node.remove(); else purge(node);
      });
    }
  }).observe(document.documentElement,{childList:true, subtree:true});

  // Barrido periódico de respaldo (por si algo se inyecta fuera del DOM observado)
  setInterval(()=>{ purge(document.body); guardBody(); }, 1500);

  const originalOpen = window.open;
  window.open = function(url, ...rest){
    if(window.__allowNextOpen){ window.__allowNextOpen=false; return originalOpen.call(window, url, ...rest); }
    console.warn('Popup bloqueado:', url); return null;
  };
})();

/* ===== Respaldo para teclado en WebViews que no avisan del cambio de tamaño
   (ej. AppMint, AppGeyser o HTMLtoAPK en modo "adjustPan"): si tras enfocar el campo de texto
   nada se redujo, se asume que el teclado tapa la barra y se compensa
   a mano con un margen inferior estimado. Se revisa varias veces mientras
   el teclado termina de animarse, para no quedarse corto. ===== */
let kbBaseHeight = window.innerHeight;
let kbFallbackToken = 0;
async function applyKeyboardFallback(){
  const myToken = ++kbFallbackToken;
  let bestDiff = 0;
  for(let i=0; i<7; i++){
    if(myToken !== kbFallbackToken) return; // el usuario ya salió del campo, cancelar
    if(window.visualViewport && window.visualViewport.height < window.innerHeight - 60){
      document.documentElement.style.setProperty('--kb-offset','0px');
      setTimeout(chatScrollBottom, 150);
      return; // visualViewport ya lo está resolviendo por su cuenta
    }
    const diff = kbBaseHeight - window.innerHeight;
    if(diff > bestDiff) bestDiff = diff;
    await sleep(110);
  }
  const offset = bestDiff > 80 ? (bestDiff + 30) : 380; // margen extra generoso: teclado + barra de sugerencias
  document.documentElement.style.setProperty('--kb-offset', offset + 'px');
  setTimeout(chatScrollBottom, 150);
}
function clearKeyboardFallback(){ kbFallbackToken++; document.documentElement.style.setProperty('--kb-offset', '0px'); }

// ===== ESTADO GLOBAL =====
let speakReplies = storageGet('artemiss_speak', 'false') === 'true';
let thinkingLevel = storageGet('artemiss_thinking_level','serena');
if(thinkingLevel !== 'serena' && thinkingLevel !== 'ultra') thinkingLevel = 'serena'; // migración desde el sistema viejo de niveles 1-6
let userProfile = null;
try{ userProfile = JSON.parse(storageGet('artemiss_profile','null')); }catch(e){ userProfile=null; }

let conversations = [];
try{ conversations = JSON.parse(storageGet('artemiss_conversations','[]')); }catch(e){ conversations=[]; }
// cada vez que se abre la app se inicia una conversación nueva EN MEMORIA;
// solo se guarda en el historial una vez que el usuario escribe algo.
let activeConv = {id:Date.now(), title:'Nueva conversación', messages:[]};

let pendingTrivia = null;
let pendingPhoto = null; // {mime, data, dataUrl} en espera de que el usuario escriba su instrucción y envíe
let composerMode = 'preguntar'; // 'preguntar' | 'imaginar'
let lastContext = null;
let lastFollowUps = [];

// ===== HELPERS =====
function escapeHtml(str){ const div=document.createElement('div'); div.textContent=str; return div.innerHTML; }

/* ===== Tolerancia a errores de tipeo y jerga de texteo ===== */
function levenshtein(a, b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  let prev = Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]);
    }
    prev = cur;
  }
  return prev[n];
}
function fuzzyIncludesWord(text, word, maxDist=1){
  const tokens = text.toLowerCase().split(/\s+/);
  return tokens.some(t=> t===word || levenshtein(t, word) <= maxDist);
}
const TEXT_SHORTCUTS = {
  'q':'que','k':'que','ke':'que','kiero':'quiero','kiere':'quiere','xq':'porque','pq':'porque','pk':'porque',
  'porq':'porque','dnd':'donde','tmb':'también','tmbn':'también','tb':'también','bn':'bien','xfa':'por favor',
  'pf':'por favor','tqm':'te quiero mucho','finde':'fin de semana','depronto':'de pronto'
};
function normalizeQuery(text){
  return text.split(/\s+/).map(w=>{
    const clean = w.toLowerCase().replace(/[.,;!?¿¡]/g,'');
    return TEXT_SHORTCUTS[clean] || w;
  }).join(' ');
}

function decodeHtmlEntities(str){ const ta=document.createElement('textarea'); ta.innerHTML=str; return ta.value; }

  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');

function mdToHtml(raw){
  let t = escapeHtml(raw);
  t = t.replace(/```([\s\S]*?)```/g,(m,c)=>`<code style="display:block;white-space:pre-wrap;padding:8px;border-radius:8px;background:rgba(128,128,128,.12);margin:6px 0;">${c}</code>`);
  t = t.replace(/`([^`]+?)`/g,'<code>$1</code>');
  t = t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  t = t.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const lines = t.split('\n'); let html=''; let inList=false;
  for(const line of lines){
    if(/^\s*[-•]\s+/.test(line)){ if(!inList){ html+='<ul>'; inList=true; } html+=`<li>${line.replace(/^\s*[-•]\s+/,'')}</li>`; }
    else { if(inList){ html+='</ul>'; inList=false; } html += (line===''?'<br>':line+'<br>'); }
  }
  if(inList) html+='</ul>';
  return html;
}

/* =====================================================================
   VOZ — entrada (reconocimiento) y salida (síntesis)
   ===================================================================== */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
if(SpeechRecognitionCtor){
  recognizer = new SpeechRecognitionCtor();
  recognizer.lang = 'es-ES';

}
let recording = false;
document.getElementById('micBtn').onclick = ()=>{

};

  recognizer.onend = ()=>{ recording=false; document.getElementById('micBtn').classList.remove('recording'); };
  recognizer.onerror = ()=>{ recording=false; document.getElementById('micBtn').classList.remove('recording'); showToast('No se entendió, intenta de nuevo'); };
}
function speak(text){
  if(!speakReplies || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const clean = text.replace(/\*\*/g,'').replace(/[#_`]/g,'');
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'es-ES'; u.rate = 1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const result = reader.result; // data:mime;base64,XXXX
      const [meta, data] = result.split(',');
      const mime = meta.match(/data:(.*);base64/)?.[1] || file.type || 'image/jpeg';
      resolve({ mime, data });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ===== Motor de visión LOCAL sin API key (TensorFlow.js + MobileNet) =====
   Se ejecuta en el dispositivo del usuario. OJO: el código de TensorFlow.js
   se descarga de jsdelivr, pero los PESOS del modelo MobileNet se descargan
   aparte desde servidores de Google (storage.googleapis.com). Si la red del
   usuario permite jsdelivr pero bloquea ese otro dominio (común en WebViews
   empaquetados con reglas de red restrictivas), el script carga bien pero el
   modelo falla — por eso a veces parece "necesitar conexión" aunque haya
   internet. Este motor es un complemento gratuito de mejor esfuerzo; para
   análisis de imagen 100% confiable, lo más seguro sigue siendo activar la
   Gemini API Key (gratuita) en Ajustes. */
let mobilenetModel = null;
let tfLoadingPromise = null;
function loadScriptOnce(src, timeoutMs=12000){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    const timer = setTimeout(()=>reject(new Error('timeout')), timeoutMs);
    s.src = src;
    s.onload = ()=>{ clearTimeout(timer); resolve(); };
    s.onerror = ()=>{ clearTimeout(timer); reject(new Error('load-error')); };
    document.head.appendChild(s);
  });
}
function loadVisionEngine(){
  if(mobilenetModel) return Promise.resolve(mobilenetModel);
  if(tfLoadingPromise) return tfLoadingPromise;
  tfLoadingPromise = (async ()=>{
    try{
      await loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
    }catch(e){ throw new Error('SCRIPT_BLOCKED'); }
    try{
      await loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
    }catch(e){ throw new Error('SCRIPT_BLOCKED'); }
    try{
      mobilenetModel = await mobilenet.load();
    }catch(e){ throw new Error('WEIGHTS_BLOCKED'); }
    return mobilenetModel;
  })();
  return tfLoadingPromise;
}
function loadImageElement(dataUrl){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}
async function analyzeImageLocalEngine(dataUrl){
  try{
    const model = await loadVisionEngine();
    const imgEl = await loadImageElement(dataUrl);
    const preds = await model.classify(imgEl);
    if(!preds || !preds.length) return "No pude identificar claramente qué hay en la imagen con el motor local.";
    const top = preds[0];
    const others = preds.slice(1,3).map(p=>`${p.className} (${Math.round(p.probability*100)}%)`).join(', ');
    let resp = `Analicé la imagen con un motor de visión local (sin ninguna API). Lo que más se parece es a **${top.className}**, con ${Math.round(top.probability*100)}% de confianza.`;
    if(others) resp += ` También podría tratarse de: ${others}.`;
    resp += `\n\nEste motor identifica objetos/categorías generales. Si quieres una descripción más detallada y contextual, activa tu Gemini API Key (gratuita) en Ajustes.`;
    return resp;
  }catch(e){
    if(e.message === 'SCRIPT_BLOCKED'){
      return "No pude descargar el motor de visión (el script está bloqueado en esta red o WebView). Esto no depende de tu conexión sino de restricciones de la red/app. La opción confiable es activar tu Gemini API Key (gratuita) en Ajustes.";
    }
    if(e.message === 'WEIGHTS_BLOCKED'){
      return "El motor de visión cargó, pero no pude descargar los datos del modelo (bloqueados por la red o el WebView, aunque tengas internet). Activa tu Gemini API Key (gratuita) en Ajustes para un análisis 100% confiable.";
    }
    return "No pude analizar la imagen con el motor local. Activa tu Gemini API Key (gratuita) en Ajustes para un análisis de imágenes confiable.";
  }
}

// marca de agua con el logo de Artemiss sobre las imágenes generadas
function addWatermark(imageUrl){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = ()=>{
        try{
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const logo = new Image();
          logo.onload = ()=>{
            try{
              const logoSize = Math.round(canvas.width * 0.07);
              const margin = Math.round(canvas.width * 0.03);
              const x = canvas.width - logoSize - margin;
              const y = canvas.height - logoSize - margin;
              ctx.save();
              ctx.globalAlpha = 0.55;
              ctx.beginPath();
              ctx.arc(x+logoSize/2, y+logoSize/2, logoSize/2+5, 0, Math.PI*2);
              ctx.fillStyle = 'rgba(0,0,0,0.22)';
              ctx.fill();
              ctx.drawImage(logo, x, y, logoSize, logoSize);
              ctx.restore();
              resolve(canvas.toDataURL('image/png'));
            }catch(e){ resolve(imageUrl); } // si el canvas queda "contaminado" por CORS, se usa la imagen sin marca
          };
          logo.onerror = ()=>resolve(imageUrl);
          logo.src = 'images/artemiss.png';
        }catch(e){ resolve(imageUrl); }
      };
      img.onerror = ()=>resolve(imageUrl);
      img.src = imageUrl;
    }catch(e){ resolve(imageUrl); }
  });
}

    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(objUrl);

   MAPAS CONCEPTUALES — diagramas reales con Mermaid.js, sin API key.
   Se arma a partir de un tema central (Wikipedia) + artículos relacionados.
   ===================================================================== */
function isConceptMapQuery(text){ return /(mapa conceptual|mapa mental|esquema (de|sobre)|diagrama (de|sobre)|organizador gr[aá]fico)/i.test(text); }
function extractConceptMapTopic(text){
  return text
    .replace(/^(crea(me)?|haz(me)?|genera(me)?|dame|quiero|arma(me)?)\s+/i,'')
    .replace(/(un|una)\s+(mapa conceptual|mapa mental|esquema|diagrama|organizador gr[aá]fico)\s+(de|sobre)\s+/i,'')
    .replace(/[¿?]/g,'').trim();
}
function sanitizeMermaidLabel(s){
  return s.replace(/[()\[\]{}":]/g,'').replace(/\s+/g,' ').trim().slice(0,42);
}
async function buildConceptMap(topic){
  const cleaned = cleanQueryForSearch(topic);
  const wiki = await robustWikipediaSearch(cleaned, topic);
  const related = wiki ? await searchWikipediaRelated(wiki.title, wiki.lang) : [];
  let subIdeas = [];
  if(wiki && wiki.extract){
    subIdeas = wiki.extract.split(/\.\s+/).slice(1,4).map(s=>sanitizeMermaidLabel(s.split(',')[0])).filter(s=>s.length>3 && s.length<45);
  }
  const rootLabel = sanitizeMermaidLabel(wiki ? wiki.title : topic) || sanitizeMermaidLabel(topic);
  const branches = [...new Set([...related.map(r=>sanitizeMermaidLabel(r)), ...subIdeas])].filter(Boolean).slice(0,7);
  let mermaidDef = `mindmap\n  root((${rootLabel}))\n`;
  branches.forEach(b=>{ mermaidDef += `    ${b}\n`; });
  return { mermaidDef, title: rootLabel, hasContent: branches.length>0 };
}
let mermaidReady = false;
async function ensureMermaid(){
  if(window.mermaid){ mermaidReady = true; return; }
  await loadScriptOnce('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js', 15000);
  window.mermaid.initialize({ startOnLoad:false, theme:'dark', securityLevel:'loose' });
  mermaidReady = true;
}

}
async function handleConceptMapRequest(rawText){
  const topic = extractConceptMapTopic(rawText);
  showTyping();
  updateTypingStatus('Investigando el tema...');
  const { mermaidDef, title, hasContent } = await buildConceptMap(topic);
  hideTyping();

    activeConv.messages.push(msg); saveConvs(); addStaticMsg(msg);
    return;
  }
  const msg = {role:'ai', type:'diagram', content:`Mapa conceptual: ${title}`, mermaidDef};
  activeConv.messages.push(msg); saveConvs(); addStaticMsg(msg);
}

function isFollowUpQuery(text){ return /^(y\s+en\s+|y\s+de\s+|qué\s+tal\s+en\s+|que\s+tal\s+en\s+|y\s+mañana|y\s+manana)/i.test(text.trim()); }
async function handleFollowUp(text){
  if(!lastContext) return null;
  if(/^y\s+mañana|^y\s+manana/i.test(text.trim())){
    if(lastContext.type==='weather') return await getWeatherReply('clima en '+lastContext.place);
    return null;
  }
  const m = text.match(/^(?:y\s+en|y\s+de|qué\s+tal\s+en|que\s+tal\s+en)\s+(.+)/i);
  if(!m) return null;
  const target = m[1].replace(/[¿?]/g,'').trim();
  if(lastContext.type==='weather') return await getWeatherReply('clima en '+target);
  if(lastContext.type==='country') return await getCountryReply('capital de '+target);
  return null;
}
function isSimplifyRequest(text){ return /(explícalo más simple|explicalo mas simple|resúmelo|resumelo|más corto|mas corto|hazlo más simple|hazlo mas simple|no entendí|no entendi)/i.test(text); }
function simplifyLastAnswer(){
  const lastAi = [...activeConv.messages].reverse().find(m=>m.role==='ai' && m.type!=='image');
  if(!lastAi) return "Aún no he dicho nada que simplificar. ¿Sobre qué quieres que hable?";
  let short = lastAi.content.replace(/\*\*/g,'').split('\n').filter(Boolean)[0] || lastAi.content;

    /^dame\s+(unos?\s+|algunos?\s+|\d+\s+)?ejemplos?\s+de\s+/i, /^necesito\s+ejemplos?\s+de\s+/i,
    /^(quiero|dame|pon|escribe|menciona|enumera|nombra)\s+(unos?\s+|algunos?\s+|\d+\s+)?ejemplos?\s+de\s+/i,
    /^cu[aá]les?\s+son\s+(unos?\s+|algunos?\s+)?ejemplos?\s+de\s+/i, /^ejempl(o|ifica|ifícame|ificame)\s+/i,
    /^(tipos?|clases?|categorías?)\s+de\s+/i, /^cuáles\s+son\s+(los\s+)?tipos?\s+de\s+/i,
    /^(lista|listado)\s+de\s+/i, /^dame\s+una\s+lista\s+de\s+/i, /^haz\s+una\s+lista\s+de\s+/i,
    /^(características|caracteristicas)\s+de\s+/i, /^ventajas?\s+y\s+desventajas?\s+de\s+/i,
    /^para\s+qu[eé]\s+sirve\s+/i, /^usos?\s+de\s+/i, /^funciones?\s+de\s+/i, /^causas?\s+de\s+/i,
    /^consecuencias?\s+de\s+/i, /^importancia\s+de\s+/i, /^diferencias?\s+entre\s+/i

// intenta extraer una lista concreta de ejemplos desde un texto de fuente real
function extractExamplesFromText(text){
  const patterns = [
    /(?:tales como|como por ejemplo|por ejemplo|incluyen|incluyendo|entre (?:ellos|ellas)|como)\s+([^.;\n]+)/i
  ];
  for(const rx of patterns){
    const m = text.match(rx);
    if(m){
      let items = m[1].split(/,|\sy\s|\se\s/).map(s=>s.trim().replace(/^(el|la|los|las|un|una)\s+/i,'')).filter(w=>w.length>1 && w.length<60);

  }
  return null;
}

let consecutiveNetworkFailures = 0;
async function fetchJson(url, retries=1){
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(), 7000);
      const res = await fetch(url, {signal: controller.signal});
      clearTimeout(timeout);
      if(!res.ok){ continue; }
      const json = await res.json();
      consecutiveNetworkFailures = 0;
      return json;
    }catch(e){
      if(attempt===retries){ consecutiveNetworkFailures++; }
    }
  }
  return null;
}
function isLikelyNetworkBlocked(){ return consecutiveNetworkFailures >= 4; }

// búsqueda con reintentos progresivos: si la frase completa no da resultado,
// prueba acortándola palabra por palabra hasta encontrar algo útil
async function robustWikipediaSearch(rawQuery, originalText){
  const query = rawQuery;
  let wiki = await searchWikipedia(query, 'es');
  if(!wiki) wiki = await searchWikipedia(query, 'en');
  if(!wiki) wiki = await searchWikipedia(query, 'simple');
  if(wiki && wiki.extract && wiki.extract.length>=60) return wiki;

  const candidate1 = wiki; // guardamos por si no encontramos nada mejor

  // recorta desde el final, palabra por palabra
  const words = query.split(/\s+/).filter(Boolean);
  for(let cut=1; cut<words.length && cut<=3; cut++){
    const shorter = words.slice(0, words.length-cut).join(' ');
    if(shorter.length<3) break;
    const w = await searchWikipedia(shorter, 'es') || await searchWikipedia(shorter, 'en');
    if(w && w.extract && w.extract.length>=60) return w;
  }

  // recorta desde el inicio (útil si la frase empieza con palabras de relleno)
  if(words.length>3){
    for(let start=1; start<=2; start++){
      const shorter = words.slice(start).join(' ');
      const w = await searchWikipedia(shorter, 'es') || await searchWikipedia(shorter, 'en');
      if(w && w.extract && w.extract.length>=60) return w;
    }
  }

  // si el texto original tenía "sobre X" / "acerca de X", prueba con eso directamente
  if(originalText){
    const m = originalText.match(/(?:sobre|acerca de)\s+(.+)/i);
    if(m){
      const topic = m[1].replace(/[¿?.,;]/g,'').trim();
      if(topic && topic.toLowerCase() !== query.toLowerCase()){
        const w = await searchWikipedia(topic, 'es') || await searchWikipedia(topic, 'en');
        if(w && w.extract && w.extract.length>=60) return w;
      }
    }
  }

  return candidate1; // lo que haya encontrado, aunque sea corto, mejor que nada
}

async function searchWikipedia(query, lang){
  const searchUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=3&srsearch=${encodeURIComponent(query)}`;
  const searchData = await fetchJson(searchUrl);
  const results = searchData?.query?.search || [];
  for(const r of results){
    const summaryUrl = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(r.title.replace(/ /g,'_'))}`;
    const summaryData = await fetchJson(summaryUrl);
    if(summaryData && summaryData.extract && summaryData.type !== 'disambiguation'){
      return { title: summaryData.title || r.title, extract: summaryData.extract, lang };
    }
  }
  return null;
}

  const searchData = await fetchJson(searchUrl);
  const top = searchData?.query?.search?.[0]; if(!top) return null;
  const title = top.title;
  const extractUrl = `https://${lang}.wiktionary.org/w/api.php?action=query&format=json&origin=*&prop=extracts&explaintext=1&exintro=1&titles=${encodeURIComponent(title)}`;
  const data = await fetchJson(extractUrl);
  const pages = data?.query?.pages; if(!pages) return null;
  const page = Object.values(pages)[0]; if(!page || !page.extract) return null;
  return { title, extract: page.extract };
}

  const cfg = THINKING_LEVELS[thinkingLevel];
  const query = cleanQueryForSearch(rawText);
  const wantsExamples = isExamplesQuery(rawText);

  onStatus && onStatus('Pensando...');
  await sleep(280);
  if(cfg.deep){ onStatus && onStatus('Analizando a fondo la pregunta...'); await sleep(400); }
  else { onStatus && onStatus('Buscando en fuentes...'); }

  let wiki = await robustWikipediaSearch(query, rawText);

  if(cfg.deep){ onStatus && onStatus('Verificando en fuentes adicionales...'); }

  const [wiktionary, ddg] = await Promise.all([
    cfg.useWiktionary ? searchWiktionary(query,'es') : null,
    cfg.useDdg ? searchDuckDuckGo(query) : null
  ]);

  let wikidata = null;
  if(cfg.crosscheck && (!wiki || cfg.deep)){ wikidata = await searchWikidata(query,'es'); }

  let related = [];
  if(cfg.useRelated && wiki){ related = await searchWikipediaRelated(wiki.title, wiki.lang); }

  if(cfg.deep){ onStatus && onStatus('Sintetizando la respuesta...'); await sleep(350); }

  if(!wiki && !wiktionary && !ddg && !wikidata){
    if(isLikelyNetworkBlocked()){
      return `No pude conectarme a ninguna fuente de búsqueda. Parece que tu red actual (WiFi/datos) está bloqueando el acceso a estos servicios. Prueba cambiar de red (por ejemplo, de WiFi a datos móviles) o revisa si tienes un firewall/DNS restringido activo.`;
    }
    return `Busqué "${query}" en varias fuentes (Wikipedia, Wikcionario, DuckDuckGo, Wikidata) pero no encontré algo concreto. ¿Puedes reformular la pregunta con otras palabras?`;
  }

  // si el usuario pidió ejemplos/tipos/lista, intenta extraer una lista real del texto de la fuente
  if(wantsExamples){
    const sourceText = (wiki?.extract || '') + ' ' + (wiktionary?.extract || '') + ' ' + (ddg?.extract || '');
    const examples = extractExamplesFromText(sourceText);
    if(examples){
      const sourceName = wiki ? (wiki.lang==='es'?'Wikipedia':'Wikipedia (inglés)') : (wiktionary ? 'Wikcionario' : 'DuckDuckGo');
      let resp = `Encontré estos ejemplos sobre "${query}" según ${sourceName}:\n\n` + examples.map(e=>`- ${e}`).join('\n');
      resp += `\n\n_Estos ejemplos vienen directamente de la fuente, no son inventados._`;
      return resp;
    }
  }

  const parts = [];
  const intros = wantsExamples
    ? [`No encontré una lista de ejemplos ya armada, pero esto es lo que dicen las fuentes sobre "${query}" (puede que incluya ejemplos dentro del texto):`]
    : [`Investigué sobre "${query}" y esto es lo que encontré:`,`Según lo que pude contrastar sobre "${query}":`,`Esto es lo más relevante que encontré:`];
  parts.push(intros[Math.floor(Math.random()*intros.length)]);

  if(wiki){
    let extract = wiki.extract.trim();
    if(extract.length > cfg.extract) extract = extract.slice(0,cfg.extract).replace(/\s+\S*$/,'')+'...';
    parts.push('\n\n'+extract);
  } else if(wiktionary){
    let extract = wiktionary.extract.trim();
    if(extract.length > cfg.extract) extract = extract.slice(0,cfg.extract).replace(/\s+\S*$/,'')+'...';
    parts.push('\n\n'+extract);
  } else if(wikidata){
    parts.push('\n\n'+wikidata.extract);
  }

  if(wiktionary && wiki){
    let def = wiktionary.extract.trim();
    if(def.length>220) def = def.slice(0,220).replace(/\s+\S*$/,'')+'...';
    parts.push(`\n\n**Definición (Wikcionario):** ${def}`);
  }
  if(ddg && ddg.extract && (!wiki || !wiki.extract.includes(ddg.extract.slice(0,40)))){
    let extra = ddg.extract.trim();
    if(extra.length>260) extra = extra.slice(0,260).replace(/\s+\S*$/,'')+'...';
    parts.push(`\n\n**Además:** ${extra}`);
  }
  if(cfg.deep && wikidata && wiki){
    parts.push(`\n\n**Verificación cruzada (Wikidata):** ${wikidata.extract}`);
  }
  if(related.length){ parts.push('\n\n**Quizás también te interese:** '+related.join(', ')); }
  if(cfg.deep){ parts.push('\n\n_Respuesta generada con verificación en múltiples fuentes (Nivel 6)._'); }

  lastFollowUps = ['Cuéntame más', 'Dame un ejemplo'];
  return parts.join('');
}

// ===== GROQ vía backend propio (sin key en el cliente) =====
async function callGroq(prompt, history){
  try{
    const messages = [];
    const nombre = userProfile?.name;
    messages.push({
      role: 'system',
      content: nombre
        ? `Eres Artemiss, una IA en español. Saluda a ${nombre} por su nombre cuando sea natural, sin exagerar.`
        : 'Eres Artemiss, una IA en español.'
    });
    history.forEach(m => messages.push({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.content }));
    messages.push({ role: 'user', content: prompt });

    const res = await fetch('https://artemiss-backend.vercel.app/api/artemisa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });

    const data = await res.json();
    if(!res.ok || !data.choices) return "Error: " + (data?.error?.message || data?.error || "Error en backend");
    return data.choices[0]?.message?.content || "No obtuve respuesta, intenta de nuevo.";
  }catch(e){
    return "Error de conexión con Artemiss: " + e.message;
  }
}
// ===== ORQUESTADOR =====
async function getResponse(rawText, history, onStatus){
  const text = normalizeQuery(rawText);
  if(isTriviaAnswer(text)) return resolveTriviaAnswer(text);
  if(isTriviaRequest(text)) return await startTrivia();
  if(isSimplifyRequest(text)) return simplifyLastAnswer();
  if(isFollowUpQuery(text)){ const f = await handleFollowUp(text); if(f) return f; }
  if(isWhoAmIQuery(text)) return userProfile?.name ? `Te llamas **${userProfile.name}** 😊` : "Aún no me has dicho tu nombre. Puedes configurarlo en Ajustes.";
  if(isCreatorQuery(text)) return creatorReply();

  return await callGroq(text, history);

  if(isSmallTalk(text)){ await sleep(250); return smallTalkReply(text); }
  if(isIdentityQuery(text)){ await sleep(250); return "Soy Artemiss. Busco información en muchas fuentes, genero imágenes, cuento chistes, juego trivia y recuerdo el contexto de la conversación — todo sin necesitar ninguna API."; }
  if(isCapabilityQuery(text)){ await sleep(250); return "Puedo: buscar información a fondo (con niveles de pensamiento 1-6), generar imágenes, crear mapas conceptuales, analizar fotos que subas, hacer cálculos, decir la hora/clima/efemérides, convertir monedas, dar datos de países, contar chistes y jugar trivia. También reconozco tu nombre si lo configuras en Ajustes."; }
  if(isDateTimeQuery(text)){ await sleep(250); return dateTimeReply(); }
  if(isJokeQuery(text)){ const j=await getJokeReply(); if(j) return j; }
  if(isCurrencyQuery(text)){ const c=await getCurrencyReply(text); if(c) return c; }
  if(isCountryQuery(text)){ const c=await getCountryReply(text); if(c) return c; }
  if(isWeatherQuery(text)){ const w=await getWeatherReply(text); if(w) return w; }
  if(isOnThisDayQuery(text)){ const r=await getOnThisDayReply(); if(r) return r; }
  if(isRandomFactQuery(text)){ const r=await getRandomFactReply(); if(r) return r; }
  if(isAdviceQuery(text)){ const r=await getAdviceReply(); if(r) return r; }
  if(isMathQuery(text)){ const r=tryMath(text); if(r!==null) return `El resultado es **${r}**.`; }

  lastFollowUps = [];
  return await localAdvancedSearch(text, onStatus);
}

// ===== NAVEGACIÓN =====
function switchPage(targetId, titleText){
  const current = document.querySelector('.page.active');
  const target = document.getElementById(targetId);
  if(current === target) return;
  if(current){ current.classList.add('leaving'); current.classList.remove('active'); setTimeout(()=>current.classList.remove('leaving'),300); }
  target.classList.add('active');
  document.getElementById('title').textContent = titleText;
  const composer = document.getElementById('chatInput');
  if(targetId === 'settingsPage'){ composer.style.display = 'none'; }
  else { composer.style.display = ''; }
}
function openSettings(){ haptic(); switchPage('settingsPage','Ajustes'); refreshProfileUI(); }
function goToChat(){ haptic(); switchPage('chatPage','Artemiss'); }


// ===== RENDER CHAT =====
const CHIPS = ["Cuéntame un chiste","Hazme una pregunta de trivia","Genera una imagen de un dragón de cristal","¿Qué hora es?"];
const DAY_NAMES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function getGreeting(){
  const now = new Date();
  const hour = now.getHours();
  const day = DAY_NAMES[now.getDay()];
  const name = userFirstName();
  const withName = (base)=> name ? `${base}, ${name}` : base;
  if(hour>=5 && hour<12) return withName(`¡Feliz ${day}`) + '!';
  if(hour>=12 && hour<19) return withName('Buenas tardes');
  return withName('Buenas noches');
}

function renderGreetingScreen(){
  const chatArea = document.getElementById('chatMessages');
  const wrap = document.createElement('div'); wrap.className='greeting-screen';
  wrap.innerHTML = `
    <div class="greeting-icon"><img src="images/artemiss.png" alt="Artemiss"></div>
    <h1 class="greeting-text">${escapeHtml(getGreeting())}</h1>
    <p class="greeting-sub">¿En qué te ayudo hoy?</p>
  `;
  chatArea.appendChild(wrap);
  renderChips(CHIPS, 'chipsWrap');
}

function renderChat(){
  const chatArea=document.getElementById('chatMessages'); chatArea.innerHTML='';
  if(activeConv.messages.length===0){
    renderGreetingScreen();
  } else {
    activeConv.messages.forEach(m=>addStaticMsg(m));
  }
  chatScrollBottom();
}

function renderChips(list, wrapId){
  if(!list || !list.length) return;
  const chatArea=document.getElementById('chatMessages');
  const wrap = document.createElement('div'); wrap.className='suggestion-chips'; wrap.id=wrapId;
  list.forEach(c=>{
    const chip = document.createElement('div'); chip.className='chip'; chip.textContent=c;
    chip.onclick = ()=>{ document.getElementById('userInput').value=c; sendMessage(); };
    wrap.appendChild(chip);
  });
  chatArea.appendChild(wrap);
  chatScrollBottom();
}

function buildRow(role){
  const row = document.createElement('div'); row.className='msg-row '+role;
  const inner = document.createElement('div'); inner.className='msg-inner';
  const avatar = document.createElement('div');
  if(role==='ai'){ avatar.className='avatar-fx ai-img'; avatar.innerHTML='<img src="images/artemiss.png" alt="Artemiss">'; }
  else { avatar.className='avatar-fx user'; avatar.textContent = userFirstName() ? userFirstName()[0].toUpperCase() : 'Tú'; }
  const content = document.createElement('div'); content.className='msg-content';
  inner.appendChild(avatar); inner.appendChild(content); row.appendChild(inner);
  return {row, content};
}

function addStaticMsg(msg){
  const chatArea = document.getElementById('chatMessages');
  const {row, content} = buildRow(msg.role);
  if(msg.type==='image'){
    const cap=document.createElement('div'); cap.className='msg-text'; cap.textContent=msg.content;
    content.appendChild(cap);
    const img=document.createElement('img'); img.className='gen-image'; img.alt=msg.prompt||'';
    img.onload=()=>{ img.classList.add('loaded'); chatScrollBottom(); };
    img.src=msg.imageUrl; img.onclick=()=>openLightbox(msg.imageUrl);
    content.appendChild(img);
    content.appendChild(buildImageActions(msg.imageUrl, msg.prompt));
  } else if(msg.type==='photo'){
    const img=document.createElement('img'); img.className='gen-image loaded'; img.alt='Foto enviada';
    img.style.maxWidth='200px'; img.src=msg.imageUrl; img.onclick=()=>openLightbox(msg.imageUrl);
    content.appendChild(img);
  } else if(msg.type==='diagram'){
    const cap=document.createElement('div'); cap.className='msg-text'; cap.textContent=msg.content;
    content.appendChild(cap);
    const box=document.createElement('div'); box.className='mermaid-box';
    box.textContent = 'Generando diagrama...';
    content.appendChild(box);
    renderMermaidBox(box, msg.mermaidDef);
  } else {
    const textEl=document.createElement('div');
    textEl.className='msg-text'+(msg.role==='user'?' user-bubble':'');
    textEl.innerHTML = msg.role==='ai' ? mdToHtml(msg.content) : escapeHtml(msg.content);
    content.appendChild(textEl);
    if(msg.role==='ai') content.appendChild(buildActions(msg.content));
  }
  chatArea.appendChild(row);
}

function buildActions(text){
  const actions=document.createElement('div'); actions.className='msg-actions';
  const copyBtn=document.createElement('button'); copyBtn.innerHTML='<img src="images/copiar.png" width="20">';
  copyBtn.onclick=()=>{ navigator.clipboard?.writeText(text).then(()=>showToast('Copiado ✅')).catch(()=>showToast('No se pudo copiar')); haptic(); };
  actions.appendChild(copyBtn);
  return actions;
}

let thinkingCycleTimer = null;
function showTyping(){
  const wrap=document.getElementById('chatMessages');
  const {row, content} = buildRow('ai'); row.id='typingRow';
  const dots=document.createElement('div'); dots.className='typing-dots';
  dots.innerHTML='<span></span><span></span><span></span><span class="typing-status" id="typingStatus"></span>';
  content.appendChild(dots); wrap.appendChild(row); chatScrollBottom();
  startThinkingCycle();
}
function startThinkingCycle(){
  const words = ['Pensando...','Razonando...','Analizando...'];
  let i = 0;
  const el = ()=>document.getElementById('typingStatus');
  if(el()) el().textContent = words[0];
  clearInterval(thinkingCycleTimer);
  thinkingCycleTimer = setInterval(()=>{
    i = (i+1) % words.length;
    const e = el();
    if(!e){ clearInterval(thinkingCycleTimer); return; }
    e.textContent = words[i];
    chatScrollBottom();
  }, 850);
}
function updateTypingStatus(text){
  clearInterval(thinkingCycleTimer);
  const el=document.getElementById('typingStatus'); if(el) el.textContent = text; chatScrollBottom();
}
function hideTyping(){ clearInterval(thinkingCycleTimer); document.getElementById('typingRow')?.remove(); }

async function typeAiMessage(text){
  const chatArea=document.getElementById('chatMessages');
  const {row, content} = buildRow('ai');
  const textEl=document.createElement('div'); textEl.className='msg-text';
  const cursor=document.createElement('span'); cursor.className='cursor-blink';
  textEl.appendChild(cursor); content.appendChild(textEl); chatArea.appendChild(row); chatScrollBottom();
  const words = text.split(/(\s+)/); let acc='';
  for(let i=0;i<words.length;i+=2){
    acc += words[i]+(words[i+1]||'');
    textEl.textContent = acc; textEl.appendChild(cursor); chatScrollBottom();
    await sleep(14);
  }
  textEl.innerHTML = mdToHtml(text);
  content.appendChild(buildActions(text));
  if(lastFollowUps.length) renderChips(lastFollowUps, null);
  chatScrollBottom();
  speak(text);
}

function setSending(isSending){
  const btn=document.getElementById('sendBtn'); btn.disabled=isSending;
  btn.innerHTML = isSending ? '<span class="btn-spinner"></span>' : '➤';
}

let sending=false;
async function sendMessage(){
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(sending) return;
  if(!text && !pendingPhoto) return;

  sending=true; setSending(true);
  input.value=''; input.style.height='auto'; input.blur(); haptic();
  updateComposerButtons();
  document.getElementById('chipsWrap')?.remove();
  document.querySelector('.greeting-screen')?.remove();

  if(pendingPhoto){
    await sendPhotoMessage(text);
    sending=false; setSending(false);
    return;
  }

  ensureActiveConvInHistory();
  activeConv.messages.push({role:'user',content:text});
  if(activeConv.messages.filter(m=>m.role==='user').length===1) activeConv.title = text.slice(0,32);
  saveConvs();
  addStaticMsg({role:'user',content:text});

  if(composerMode==='imaginar' || (isImageGenQuery(text) && !isTriviaAnswer(text))){
    await handleImageGenRequest(text);
    sending=false; setSending(false); return;
  }
  if(isConceptMapQuery(text)){
    await handleConceptMapRequest(text);
    sending=false; setSending(false); return;
  }

  showTyping();
  const response = await getResponse(text, activeConv.messages.slice(0,-1), updateTypingStatus);
  hideTyping();

  activeConv.messages.push({role:'ai',content:response});
  saveConvs();
  await typeAiMessage(response);

  sending=false; setSending(false);
}
